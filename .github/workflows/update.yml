name: Daily Update

on:
  schedule:
    - cron: '30 0 * * *'   # UTC 00:30 = 北京时间 08:30,每天自动采集+发布
  workflow_dispatch: {}      # 支持手动一键触发

permissions:
  contents: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect & Build
        run: python main.py
        env:
          ARENA_PROXY: ''    # GitHub runner 在境外,直连即可,无需代理

      - name: Commit & Push
        run: |
          git config user.name "arena-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: auto update $(date -u +%F)" && git push)
